<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Pariya School Management System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root {
  --dash-bg:#0f1b14; --dash-surface:#162118; --dash-card:#1c2b20; --dash-border:#2a3d2d;
  --dash-green:#22c55e; --dash-green-soft:rgba(34,197,94,0.12); --dash-green-glow:rgba(34,197,94,0.25);
  --dash-text:#e8f5ea; --dash-muted:#7ca882; --dash-accent:#4ade80; --dash-danger:#ef4444; --dash-blue:#3b82f6;
  --primary:#228B2A; --soft:#C8E6C9; --accent:#1f6b3b; --muted:#6b7a73; --border:#1f6b3b; --text:#222;
  --font-ui:'Nunito',sans-serif; --font-display:'Playfair Display',serif;
  --radius:14px; --radius-sm:8px; --shadow:0 4px 24px rgba(0,0,0,0.35); --transition:all .22s cubic-bezier(.4,0,.2,1);
}
[data-theme="light"] {
  --dash-bg:#f0f4f1; --dash-surface:#fff; --dash-card:#f8faf8; --dash-border:#d1e0d4;
  --dash-green:#16a34a; --dash-green-soft:rgba(22,163,74,0.10); --dash-green-glow:rgba(22,163,74,0.22);
  --dash-text:#1a2e1e; --dash-muted:#4a6b52; --dash-accent:#15803d; --dash-danger:#dc2626; --dash-blue:#2563eb;
}
* { box-sizing:border-box; }
body { margin:0; background:var(--dash-bg); color:var(--dash-text); font-family:var(--font-ui); }
a { color:inherit; }
button, input, select { font-family:var(--font-ui); }
::-webkit-scrollbar { width:8px; height:8px; }
::-webkit-scrollbar-thumb { background:var(--dash-border); border-radius:8px; }

/* ---------- Login ---------- */
.login-split { display:flex; min-height:100vh; width:100%; }
.login-hero { flex:1; display:none; background:linear-gradient(135deg,#0f2d12 0%,#1a4a20 40%,#0f1b14 100%);
  padding:40px 36px; flex-direction:column; justify-content:space-between; position:relative; overflow:hidden; }
.login-hero::before { content:''; position:absolute; inset:0;
  background:radial-gradient(ellipse at 30% 20%, rgba(34,197,94,.25) 0%, transparent 60%),
             radial-gradient(ellipse at 80% 80%, rgba(74,222,128,.12) 0%, transparent 55%); }
.login-hero-title { font-family:var(--font-display); font-size:28px; color:#e8f5ea; line-height:1.25; margin-bottom:10px; position:relative; }
.login-hero-sub { color:#9fd3a8; font-size:14px; position:relative; }
@media (min-width:860px){ .login-hero{ display:flex; } .login-right{ min-width:420px; max-width:480px; } }
.login-right { flex:1; display:flex; align-items:center; justify-content:center; background:var(--dash-bg); padding:24px; }
.login-box { width:100%; max-width:380px; }
.login-school { text-align:center; margin-bottom:22px; }
.login-school h1 { font-family:var(--font-display); font-size:18px; color:var(--dash-accent); margin-bottom:3px; }
.login-school p { color:var(--dash-muted); font-size:12px; }
.login-tabs { display:flex; gap:6px; background:var(--dash-card); border:1px solid var(--dash-border); border-radius:var(--radius-sm); padding:4px; margin-bottom:18px; }
.login-tab { flex:1; text-align:center; padding:9px; border-radius:6px; cursor:pointer; font-size:12px; font-weight:800; color:var(--dash-muted); }
.login-tab.active { background:var(--dash-green); color:#04150a; }
.field { margin-bottom:14px; }
.field label { display:block; font-size:11px; font-weight:800; color:var(--dash-muted); margin-bottom:6px; text-transform:uppercase; letter-spacing:.03em; }
.field input, .field select { width:100%; padding:11px 12px; border-radius:var(--radius-sm); border:1px solid var(--dash-border); background:var(--dash-surface); color:var(--dash-text); font-size:14px; }
.field input:focus, .field select:focus { outline:none; border-color:var(--dash-green); box-shadow:0 0 0 3px var(--dash-green-soft); }
.btn-primary { width:100%; padding:12px; border-radius:var(--radius-sm); border:none; background:var(--dash-green); color:#04150a; font-weight:900; font-size:14px; cursor:pointer; transition:var(--transition); }
.btn-primary:hover { box-shadow:0 0 16px var(--dash-green-glow); }
.btn-primary:disabled { opacity:.6; cursor:not-allowed; }
.login-error { background:rgba(239,68,68,.12); border:1px solid rgba(239,68,68,.3); color:#fca5a5; padding:9px 12px; border-radius:8px; font-size:12px; margin-bottom:14px; display:none; }

/* ---------- Shell ---------- */
.app-shell { display:none; min-height:100vh; }
.sidebar { position:fixed; top:0; left:0; bottom:0; width:230px; background:var(--dash-surface); border-right:1px solid var(--dash-border);
  display:flex; flex-direction:column; z-index:200; transform:translateX(-100%); transition:transform .28s cubic-bezier(.4,0,.2,1); }
.sidebar.open { transform:translateX(0); }
.sidebar-header { padding:18px 16px 14px; border-bottom:1px solid var(--dash-border); display:flex; align-items:center; gap:10px; }
.sidebar-header-title { font-family:var(--font-display); font-size:13px; color:var(--dash-accent); font-weight:700; line-height:1.2; flex:1; }
.sidebar-close { background:none; border:none; color:var(--dash-muted); font-size:18px; cursor:pointer; }
.sidebar-nav { flex:1; overflow-y:auto; padding:10px 8px; }
.sidebar-item { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:var(--radius-sm); color:var(--dash-muted);
  font-size:13px; font-weight:700; cursor:pointer; border:none; background:none; width:100%; text-align:left; margin-bottom:2px; }
.sidebar-item:hover, .sidebar-item.active { background:var(--dash-green-soft); color:var(--dash-accent); }
.sidebar-item .si-icon { width:18px; text-align:center; }
.sidebar-footer { padding:12px; border-top:1px solid var(--dash-border); }
.sidebar-overlay { position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:199; display:none; }
.sidebar-overlay.show { display:block; }
.main-area { margin-left:0; padding:16px; }
@media (min-width:860px){ .sidebar{ transform:translateX(0); } .main-area{ margin-left:230px; } .hamburger-btn{ display:none; } }

.topbar { display:flex; align-items:center; gap:12px; margin-bottom:18px; }
.hamburger-btn, .theme-toggle-btn { background:none; border:1px solid var(--dash-border); border-radius:var(--radius-sm); color:var(--dash-muted); font-size:16px; padding:7px 10px; cursor:pointer; }
.topbar-title { font-family:var(--font-display); font-size:19px; color:var(--dash-text); flex:1; }
.topbar-role { font-size:11px; font-weight:800; color:var(--dash-accent); background:var(--dash-green-soft); padding:5px 10px; border-radius:999px; }

.tab-panel { display:none; }
.tab-panel.active { display:block; animation:fadeInUp .25s ease; }
@keyframes fadeInUp { from{opacity:0; transform:translateY(12px);} to{opacity:1; transform:translateY(0);} }

.card-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:12px; }
.class-card { background:var(--dash-card); border:1px solid var(--dash-border); border-radius:var(--radius); padding:16px; cursor:pointer; transition:var(--transition); }
.class-card:hover { border-color:var(--dash-green); transform:translateY(-2px); }
.class-card .cc-icon { font-size:22px; margin-bottom:8px; }
.class-card .cc-name { font-weight:800; font-size:14px; }
.class-card .cc-sub { font-size:11px; color:var(--dash-muted); margin-top:2px; }

.btn { padding:9px 15px; border-radius:var(--radius-sm); border:1px solid var(--dash-border); background:var(--dash-card); color:var(--dash-text); font-weight:800; font-size:12px; cursor:pointer; transition:var(--transition); }
.btn:hover { border-color:var(--dash-green); color:var(--dash-accent); }
.btn.btn-green { background:var(--dash-green); color:#04150a; border-color:var(--dash-green); }
.btn.btn-danger { background:rgba(239,68,68,.1); border-color:rgba(239,68,68,.3); color:#ef4444; }
.btn:disabled { opacity:.5; cursor:not-allowed; }

.term-pills { display:flex; gap:8px; margin:14px 0; flex-wrap:wrap; }
.term-pill { padding:8px 14px; border-radius:999px; border:1px solid var(--dash-border); background:var(--dash-card); font-size:12px; font-weight:800; cursor:pointer; }
.term-pill.active { background:var(--dash-green); color:#04150a; border-color:var(--dash-green); }

table.data-table { width:100%; border-collapse:collapse; font-size:12.5px; }
table.data-table th, table.data-table td { border:1px solid var(--dash-border); padding:7px 8px; text-align:center; }
table.data-table th { background:var(--dash-card); color:var(--dash-accent); font-size:11px; }
table.data-table input { width:52px; padding:4px; text-align:center; border-radius:6px; border:1px solid var(--dash-border); background:var(--dash-surface); color:var(--dash-text); }
table.data-table td.name-cell { text-align:left; font-weight:700; }

.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:500; display:none; align-items:center; justify-content:center; padding:16px; }
.modal-overlay.show { display:flex; }
.modal-box { background:var(--dash-surface); border:1px solid var(--dash-border); border-radius:var(--radius); padding:22px; max-width:440px; width:100%; max-height:88vh; overflow-y:auto; }
.modal-box h3 { font-family:var(--font-display); color:var(--dash-accent); margin-top:0; }

.settings-card { background:var(--dash-card); border:1px solid var(--dash-border); border-radius:var(--radius); padding:18px 16px; margin-bottom:14px; }
.settings-card-title { font-size:13px; font-weight:900; color:var(--dash-accent); margin-bottom:14px; }
.settings-row { display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--dash-border); gap:10px; flex-wrap:wrap; }
.settings-row:last-child { border-bottom:none; }

.pill-list { display:flex; flex-wrap:wrap; gap:8px; }
.tag { background:var(--dash-green-soft); color:var(--dash-accent); padding:4px 10px; border-radius:999px; font-size:11px; font-weight:800; display:flex; align-items:center; gap:6px; }
.tag button { background:none; border:none; color:inherit; cursor:pointer; }

/* ---------- Report card (EXACT structure/CSS from original app) ---------- */
.card.category-nursery { --primary:#A52A2A !important; --soft:#FFDCDC !important; --accent:#800000 !important; --border:#A52A2A !important; }
.card.category-jss     { --primary:#6A0DAD !important; --soft:#E6D9F5 !important; --accent:#4B0082 !important; --border:#6A0DAD !important; }
.card.category-ss      { --primary:#000080 !important; --soft:#CCE5FF !important; --accent:#003366 !important; --border:#000080 !important; }

.card {
  background:#fff; border-radius:10px; padding:14px;
  border:2px solid var(--border); margin:0 auto 20px; max-width:820px;
  position:relative; color:#222;
  font-family:'Inter',system-ui,sans-serif;
}
.card * { font-family:'Inter',system-ui,sans-serif; }
.card .card-top { display:flex; align-items:center; gap:12px; margin-bottom:8px; }
.card .card-top .logo-container { flex:0 0 86px; text-align:center; }
.card .card-top .logo-container img { width:86px; height:86px; object-fit:contain; border-radius:10px; border:1px solid rgba(0,0,0,0.04); }
.school-logo-img { width:86px; height:86px; object-fit:contain; border-radius:10px; }
.school-title { flex:1; }
.card .school-title h2 { color:var(--primary); font-size:18px; font-weight:900; margin-bottom:4px; text-align:center; }
.card .school-title p  { color:var(--muted); font-size:11px; margin:0; text-align:center; }
.card .school-title .muted { font-size:10px; }
.card .contact-info { font-size:10px; color:var(--accent); text-align:center; margin-top:4px; font-weight:700; }

.info-separator { border:0; border-top:1px solid var(--border); margin:8px 0; }

.student-header {
  padding:6px 0; margin-top:6px; margin-bottom:6px;
  display:flex; justify-content:space-between; align-items:flex-end;
  border-bottom:2px solid var(--soft);
  font-size:14px; font-weight:800;
}
.student-header .name-block { font-size:18px; font-weight:900; color:var(--primary); }
.student-header .report-term { flex-grow:1; text-align:center; color:var(--accent); font-size:14px; font-weight:900; }
.student-header .session-info { color:var(--accent); white-space:nowrap; font-weight:900; }
.student-header .name-block strong { color:var(--accent); font-weight:800; margin-right:4px; }

.info-table { width:100%; border-collapse:collapse; margin-top:4px; font-size:12px; font-weight:900; }
.info-table td { text-align:left; color:#222; border:1px solid rgba(31,107,59,0.25); font-weight:800; flex-basis:33.33%; padding:4px 8px !important; vertical-align:middle; }
.info-table tr { display:flex; }
.info-table td strong { color:var(--accent); font-weight:900; margin-right:4px; display:inline-block; min-width:80px; }
.info-table .data { font-weight:900; color:#222; }

.card-subjects { margin-top:6px; }
.card-subjects table { width:100%; border-collapse:collapse; font-size:13px; }
.card-subjects th, .card-subjects td { border:1px solid var(--border); padding:3px 4px !important; font-size:11px; font-weight:800; color:#222; }
.card-subjects thead th { background:var(--primary); color:#fff; }
.card-subjects tbody td { background:var(--soft); }

.lower-row { display:flex; gap:12px; align-items:stretch; margin-top:12px; }
.grading-box { flex-basis:40%; border-radius:10px; padding:8px; background:transparent; border:1px solid rgba(0,0,0,0.04); }
.grading-box table { width:100%; border-collapse:collapse; font-size:13px; }
.grading-box th, .grading-box td { padding:6px; border:1px solid rgba(0,0,0,0.06); font-weight:800; color:#222; }
.grading-box thead th { background:var(--primary); color:#fff; }
.grading-box tbody td { background:var(--soft); }
.total-summary { flex-basis:60%; display:flex; flex-direction:column; align-items:stretch; }
.total-summary .summary-title { font-size:10px; font-weight:900; text-align:center; color:var(--accent); text-transform:uppercase; letter-spacing:0.06em; margin-bottom:3px; }
.total-summary table { width:100%; border-collapse:collapse; font-size:11px; }
.total-summary thead th { background:var(--primary); color:#fff; border:2px solid var(--border); font-weight:800; padding:4px; text-align:center; }
.total-summary tbody td { background:var(--soft); border:2px solid var(--border); vertical-align:middle; text-align:center; font-weight:800; padding:4px; color:#222; font-size:11px; }

.annual-summary-box { flex-basis:40%; border-radius:8px; padding:6px; border:1px solid var(--border); background:var(--soft); font-size:10px; }
.annual-summary-box table { width:100%; border-collapse:collapse; }
.annual-summary-box th { background:var(--primary); color:#fff; padding:4px 3px; font-size:9px; font-weight:800; border:1px solid var(--border); text-align:center; }
.annual-summary-box td { background:#fff; padding:4px 3px; font-size:9px; font-weight:800; border:1px solid var(--border); text-align:center; color:#222; }
.annual-summary-box .ann-title { font-size:9px; font-weight:900; color:var(--accent); text-align:center; text-transform:uppercase; margin-bottom:3px; letter-spacing:0.04em; }

.pos-plain { font-weight:900; color:var(--primary); font-size:15px; display:block; }
.remarks   { margin-top:12px; font-weight:900; color:#222; font-size:13px; }
.bottom-row { display:flex; justify-content:space-between; align-items:center; margin-top:18px; gap:8px; }
.signature-block { width:30%; text-align:center; display:flex; flex-direction:column; justify-content:flex-end; }
.signature-block img.sig-img { max-width:100%; height:30px; object-fit:contain; margin-bottom:-5px; opacity:0.9; }
.sig-line    { border-top:1.5px solid #000; margin:4px auto 2px; width:75%; }
.sig-caption { font-size:11px; color:var(--muted); margin-top:2px; }

.qr-code-container {
  width:105px; height:105px; background:#fff; padding:1px;
  border:1px solid var(--border);
  display:flex; align-items:center; justify-content:center; margin-top:2px;
}
.qr-code-container img { max-width:100%; }
.card-dl-btn { background:var(--primary); color:#fff; border:0; padding:4px 8px; border-radius:8px; font-weight:900; cursor:pointer; font-size:10px; }

@media print {
  .card { margin:0 !important; padding:6mm !important; page-break-after:always !important; page-break-inside:avoid !important;
    border:2.5px solid var(--border) !important; outline:2.5px solid var(--border) !important; background:#fff !important; color:#222 !important; box-sizing:border-box !important; }
  .card:last-child { page-break-after:avoid !important; }
  .card-dl-btn, .qr-wrap > button { display:none !important; }
  .card-subjects table { border-collapse:collapse !important; }
  .card-subjects th, .card-subjects td { border:1px solid var(--border) !important; }
  .card-subjects thead th { background:var(--primary) !important; color:#fff !important; }
  .card-subjects tbody td { background:var(--soft) !important; }
  .info-table td { border:1px solid rgba(0,0,0,0.4) !important; }
  .grading-box table { border-collapse:collapse !important; }
  .grading-box th, .grading-box td { border:1px solid rgba(0,0,0,0.4) !important; }
  .grading-box thead th { background:var(--primary) !important; color:#fff !important; }
  .grading-box tbody td { background:var(--soft) !important; }
  .total-summary table { border-collapse:collapse !important; }
  .total-summary thead th { background:var(--primary) !important; color:#fff !important; border:2px solid var(--border) !important; }
  .total-summary tbody td { background:var(--soft) !important; border:2px solid var(--border) !important; }
  .annual-summary-box { border:1px solid var(--border) !important; background:var(--soft) !important; }
  .annual-summary-box table { border-collapse:collapse !important; }
  .annual-summary-box th { background:var(--primary) !important; color:#fff !important; border:1px solid var(--border) !important; }
  .annual-summary-box td { background:#fff !important; border:1px solid var(--border) !important; }
  .remarks { border:1px solid rgba(0,0,0,0.3) !important; padding:6px 8px !important; border-radius:4px !important; }
  .sig-line { border-top:1.5px solid #000 !important; }
  .bottom-row { border-top:1px solid rgba(0,0,0,0.3) !important; padding-top:8px !important; }
  .no-print { display:none !important; }
}

/* Global print lockdown: no matter what's on screen, printing
   should only ever show actual report cards — never the sidebar,
   topbar, or any dashboard chrome bleeding onto the page. */
@media print {
  .sidebar, .sidebar-overlay, .topbar { display:none !important; }
  .main-area { margin-left:0 !important; padding:0 !important; }
  body { background:#fff !important; }
}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="loginScreen" class="login-split">
  <div class="login-hero">
    <div>
      <div class="login-hero-title">Pariya School<br/>Management System</div>
      <div class="login-hero-sub">Nursery • Primary • JSS • SS — fully powered by Supabase.</div>
    </div>
    <div class="login-hero-sub">© <span id="heroYear"></span> Pariya Academy</div>
  </div>
  <div class="login-right">
    <div class="login-box">
      <div class="login-school">
        <img id="loginSchoolLogo" src="" alt="" style="display:none;width:64px;height:64px;object-fit:contain;border-radius:12px;margin:0 auto 10px;" onerror="this.style.display='none'"/>
        <h1 id="loginSchoolName">Pariya School Management System</h1>
        <p>Sign in to continue</p>
      </div>
      <div class="login-tabs">
        <div class="login-tab active" data-mode="staff" onclick="setLoginMode('staff')">Staff / Admin</div>
        <div class="login-tab" data-mode="student" onclick="setLoginMode('student')">Student</div>
      </div>
      <div id="loginError" class="login-error"></div>

      <form id="staffLoginForm" onsubmit="return handleStaffLogin(event)">
        <div class="field"><label>Staff ID</label><input id="staffCode" required autocomplete="username"/></div>
        <div class="field"><label>Password</label><input id="staffPassword" type="password" required autocomplete="current-password"/></div>
        <label style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dash-muted);margin-bottom:14px;">
          <input type="checkbox" id="staffRemember" checked style="width:auto;"/> Remember me on this device
        </label>
        <button class="btn-primary" type="submit" id="staffLoginBtn">Sign In</button>
      </form>

      <form id="studentLoginForm" style="display:none;" onsubmit="return handleStudentLogin(event)">
        <div class="field"><label>Admission Number</label><input id="stuAdm" required/></div>
        <div class="field"><label>Class</label><select id="stuClass" required></select></div>
        <div class="field"><label>Password</label><input id="stuPassword" type="password" required/></div>
        <button class="btn-primary" type="submit" id="studentLoginBtn">Sign In</button>
      </form>
    </div>
  </div>
</div>

<!-- ============ APP SHELL ============ -->
<div id="appShell" class="app-shell">
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar(false)"></div>
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-header-title" id="sidebarSchoolName">Pariya SMS</div>
      <button class="sidebar-close" onclick="toggleSidebar(false)"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="sidebar-nav" id="sidebarNav"></div>
    <div class="sidebar-footer">
      <button class="btn" style="width:100%;" onclick="signOut()"><i class="fa-solid fa-right-from-bracket"></i> Sign Out</button>
    </div>
  </div>

  <div class="main-area">
    <div class="topbar">
      <button class="hamburger-btn" onclick="toggleSidebar(true)"><i class="fa-solid fa-bars"></i></button>
      <div style="flex:1;">
        <div id="topbarGreeting" style="font-size:11px;color:var(--dash-accent);font-weight:800;"></div>
        <div class="topbar-title" id="topbarTitle">Dashboard</div>
      </div>
      <span class="topbar-role" id="topbarRole"></span>
