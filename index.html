<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Pariya School Management System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Playfair+Display:wght@700;900&family=Manrope:wght@400;700;800;900&family=UnifrakturCook:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root {
  /* Core surfaces */
  --dash-bg:#0b1710; --dash-surface:#141f19; --dash-card:#1a2921; --dash-card-2:#20332a; --dash-border:#28392f;
  /* Brand */
  --dash-green:#22c55e; --dash-green-2:#16a34a; --dash-green-soft:rgba(34,197,94,0.13); --dash-green-glow:rgba(34,197,94,0.30);
  --dash-text:#eef7f0; --dash-muted:#84a892; --dash-accent:#4ade80;
  /* Semantic */
  --dash-danger:#f87171; --dash-danger-soft:rgba(248,113,113,0.14);
  --dash-warning:#fbbf24; --dash-warning-soft:rgba(251,191,36,0.14);
  --dash-info:#60a5fa; --dash-info-soft:rgba(96,165,250,0.14);
  --dash-blue:#3b82f6;
  /* Legacy aliases used by report card / certificates — do not remove */
  --primary:#228B2A; --soft:#C8E6C9; --accent:#1f6b3b; --muted:#6b7a73; --border:#1f6b3b; --text:#222;
  /* Type */
  --font-ui:'Nunito',sans-serif; --font-display:'Playfair Display',serif;
  /* Scale */
  --radius-lg:18px; --radius:14px; --radius-sm:10px; --radius-xs:7px;
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:24px; --space-6:32px;
  --shadow-sm:0 1px 3px rgba(0,0,0,0.25);
  --shadow:0 6px 20px rgba(0,0,0,0.28);
  --shadow-lg:0 16px 40px rgba(0,0,0,0.38);
  --transition:all .2s cubic-bezier(.4,0,.2,1);
  --transition-fast:all .12s ease;
}
[data-theme="light"] {
  --dash-bg:#f2f6f3; --dash-surface:#ffffff; --dash-card:#ffffff; --dash-card-2:#f6f9f6; --dash-border:#e0e8e1;
  --dash-green:#16a34a; --dash-green-2:#15803d; --dash-green-soft:rgba(22,163,74,0.10); --dash-green-glow:rgba(22,163,74,0.22);
  --dash-text:#16241a; --dash-muted:#5c7767; --dash-accent:#15803d;
  --dash-danger:#dc2626; --dash-danger-soft:rgba(220,38,38,0.09);
  --dash-warning:#d97706; --dash-warning-soft:rgba(217,119,6,0.10);
  --dash-info:#2563eb; --dash-info-soft:rgba(37,99,235,0.09);
  --dash-blue:#2563eb;
  --shadow-sm:0 1px 2px rgba(20,40,25,0.06);
  --shadow:0 4px 16px rgba(20,40,25,0.08);
  --shadow-lg:0 12px 32px rgba(20,40,25,0.12);
}
* { box-sizing:border-box; }
body { margin:0; background:var(--dash-bg); color:var(--dash-text); font-family:var(--font-ui); -webkit-font-smoothing:antialiased; }
a { color:inherit; }
button, input, select { font-family:var(--font-ui); }
::-webkit-scrollbar { width:9px; height:9px; }
::-webkit-scrollbar-thumb { background:var(--dash-border); border-radius:8px; }
::-webkit-scrollbar-thumb:hover { background:var(--dash-muted); }

/* ---------- Login ---------- */
.login-split { display:flex; min-height:100vh; width:100%; }
.login-hero { flex:1; display:none; background:
    radial-gradient(ellipse 900px 500px at 15% 10%, rgba(74,222,128,.20) 0%, transparent 60%),
    radial-gradient(ellipse 700px 600px at 85% 90%, rgba(34,197,94,.14) 0%, transparent 55%),
    linear-gradient(160deg,#0c1f11 0%,#123018 45%,#0b1710 100%);
  padding:48px 44px; flex-direction:column; justify-content:space-between; position:relative; overflow:hidden; }
.login-hero::before { content:''; position:absolute; inset:0; opacity:.5; pointer-events:none;
  background-image:radial-gradient(rgba(255,255,255,.05) 1px, transparent 1px); background-size:26px 26px; }
.login-hero-title { font-family:var(--font-display); font-size:32px; font-weight:900; color:#f2fbf4; line-height:1.22; margin-bottom:12px; position:relative; letter-spacing:.2px; }
.login-hero-sub { color:#a8dab3; font-size:14.5px; position:relative; line-height:1.6; max-width:380px; }
@media (min-width:860px){ .login-hero{ display:flex; } .login-right{ min-width:440px; max-width:520px; } }
.login-right { flex:1; display:flex; align-items:center; justify-content:center; background:var(--dash-bg); padding:24px; }
.login-box { width:100%; max-width:380px; background:var(--dash-surface); border:1px solid var(--dash-border); border-radius:var(--radius-lg); padding:32px 28px; box-shadow:var(--shadow-lg); }
.login-school { text-align:center; margin-bottom:24px; }
.login-school h1 { font-family:var(--font-display); font-size:19px; font-weight:900; color:var(--dash-text); margin-bottom:4px; letter-spacing:.2px; }
.login-school p { color:var(--dash-muted); font-size:12.5px; }
.login-tabs { display:flex; gap:4px; background:var(--dash-card-2); border:1px solid var(--dash-border); border-radius:var(--radius-sm); padding:4px; margin-bottom:22px; }
.login-tab { flex:1; text-align:center; padding:9px; border-radius:7px; cursor:pointer; font-size:12px; font-weight:800; color:var(--dash-muted); transition:var(--transition-fast); }
.login-tab.active { background:var(--dash-green); color:#04150a; box-shadow:var(--shadow-sm); }
.field { margin-bottom:16px; }
.field label { display:block; font-size:10.5px; font-weight:800; color:var(--dash-muted); margin-bottom:6px; text-transform:uppercase; letter-spacing:.05em; }
.field input, .field select { width:100%; padding:11px 13px; border-radius:var(--radius-sm); border:1.5px solid var(--dash-border); background:var(--dash-card-2); color:var(--dash-text); font-size:14px; transition:var(--transition-fast); }
.field input:focus, .field select:focus { outline:none; border-color:var(--dash-green); box-shadow:0 0 0 4px var(--dash-green-soft); }
.btn-primary { width:100%; padding:13px; border-radius:var(--radius-sm); border:none; background:linear-gradient(180deg,var(--dash-green),var(--dash-green-2)); color:#04150a; font-weight:900; font-size:14px; cursor:pointer; transition:var(--transition); box-shadow:var(--shadow-sm); letter-spacing:.02em; }
.btn-primary:hover { box-shadow:0 0 0 4px var(--dash-green-glow); transform:translateY(-1px); }
.btn-primary:active { transform:translateY(0); }
.btn-primary:disabled { opacity:.55; cursor:not-allowed; transform:none; box-shadow:none; }
.login-error { background:var(--dash-danger-soft); border:1px solid rgba(248,113,113,.35); color:var(--dash-danger); padding:10px 13px; border-radius:var(--radius-sm); font-size:12.5px; margin-bottom:16px; display:none; font-weight:700; }

/* ---------- Shell ---------- */
.app-shell { display:none; min-height:100vh; }
.sidebar { position:fixed; top:0; left:0; bottom:0; width:236px; background:var(--dash-surface); border-right:1px solid var(--dash-border);
  display:flex; flex-direction:column; z-index:200; transform:translateX(-100%); transition:transform .28s cubic-bezier(.4,0,.2,1); }
.sidebar.open { transform:translateX(0); box-shadow:var(--shadow-lg); }
.sidebar-header { padding:20px 18px 16px; border-bottom:1px solid var(--dash-border); display:flex; align-items:center; gap:10px; }
.sidebar-header-title { font-family:var(--font-display); font-size:14px; color:var(--dash-text); font-weight:800; line-height:1.25; flex:1; letter-spacing:.1px; }
.sidebar-close { background:none; border:none; color:var(--dash-muted); font-size:18px; cursor:pointer; padding:4px; border-radius:6px; transition:var(--transition-fast); }
.sidebar-close:hover { background:var(--dash-card); color:var(--dash-text); }
.sidebar-nav { flex:1; overflow-y:auto; padding:12px 10px; }
.sidebar-item { display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:var(--radius-sm); color:var(--dash-muted);
  font-size:13px; font-weight:700; cursor:pointer; border:none; background:none; width:100%; text-align:left; margin-bottom:2px;
  position:relative; transition:var(--transition-fast); }
.sidebar-item::before { content:''; position:absolute; left:-10px; top:50%; transform:translateY(-50%); width:3px; height:0; background:var(--dash-green); border-radius:0 3px 3px 0; transition:var(--transition-fast); }
.sidebar-item:hover { background:var(--dash-card); color:var(--dash-text); }
.sidebar-item.active { background:var(--dash-green-soft); color:var(--dash-accent); }
.sidebar-item.active::before { height:18px; left:0; }
.sidebar-item .si-icon { width:18px; text-align:center; flex-shrink:0; opacity:.9; }
.sidebar-footer { padding:14px 12px; border-top:1px solid var(--dash-border); }
.sidebar-footer .btn { width:100%; justify-content:center; display:flex; align-items:center; gap:8px; color:var(--dash-danger); border-color:var(--dash-border); }
.sidebar-footer .btn:hover { border-color:var(--dash-danger); background:var(--dash-danger-soft); }
.sidebar-overlay { position:fixed; inset:0; background:rgba(0,0,0,.55); backdrop-filter:blur(1px); z-index:199; display:none; }
.sidebar-overlay.show { display:block; }
.main-area { margin-left:0; padding:16px; max-width:1400px; }
@media (min-width:860px){ .sidebar{ transform:translateX(0); } .main-area{ margin-left:236px; padding:22px 28px; } .hamburger-btn{ display:none; } }

.topbar { display:flex; align-items:center; gap:12px; margin-bottom:22px; padding-bottom:16px; border-bottom:1px solid var(--dash-border); }
.hamburger-btn, .theme-toggle-btn { background:var(--dash-card); border:1px solid var(--dash-border); border-radius:var(--radius-sm); color:var(--dash-muted); font-size:15px; padding:8px 11px; cursor:pointer; transition:var(--transition-fast); }
.hamburger-btn:hover, .theme-toggle-btn:hover { color:var(--dash-accent); border-color:var(--dash-green); }
.topbar-title { font-family:var(--font-display); font-size:20px; font-weight:800; color:var(--dash-text); flex:1; letter-spacing:.1px; }
.topbar-role { font-size:10.5px; font-weight:800; color:var(--dash-accent); background:var(--dash-green-soft); padding:6px 12px; border-radius:999px; white-space:normal; text-align:right; max-width:220px; line-height:1.4; }

.tab-panel { display:none; }
.tab-panel.active { display:block; animation:fadeInUp .3s cubic-bezier(.4,0,.2,1); }
@keyframes fadeInUp { from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }

.card-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(165px,1fr)); gap:14px; }
.class-card { background:var(--dash-card); border:1px solid var(--dash-border); border-radius:var(--radius); padding:18px; cursor:pointer; transition:var(--transition); box-shadow:var(--shadow-sm); }
.class-card:hover { border-color:var(--dash-green); transform:translateY(-3px); box-shadow:var(--shadow); }
.class-card .cc-icon { font-size:24px; margin-bottom:10px; width:42px; height:42px; display:flex; align-items:center; justify-content:center; background:var(--dash-green-soft); border-radius:var(--radius-sm); }
.class-card .cc-name { font-weight:800; font-size:14px; letter-spacing:.1px; }
.class-card .cc-sub { font-size:11px; color:var(--dash-muted); margin-top:3px; font-weight:600; }

.btn { padding:9px 16px; border-radius:var(--radius-sm); border:1.5px solid var(--dash-border); background:var(--dash-card); color:var(--dash-text); font-weight:800; font-size:12px; cursor:pointer; transition:var(--transition-fast); }
.btn:hover { border-color:var(--dash-green); color:var(--dash-accent); transform:translateY(-1px); box-shadow:var(--shadow-sm); }
.btn:active { transform:translateY(0); }
.btn.btn-green { background:linear-gradient(180deg,var(--dash-green),var(--dash-green-2)); color:#04150a; border-color:var(--dash-green-2); }
.btn.btn-green:hover { box-shadow:0 0 0 3px var(--dash-green-glow); }
.btn.btn-danger { background:var(--dash-danger-soft); border-color:rgba(248,113,113,.35); color:var(--dash-danger); }
.btn.btn-danger:hover { border-color:var(--dash-danger); }
.btn:disabled { opacity:.5; cursor:not-allowed; transform:none; box-shadow:none; }

.term-pills { display:flex; gap:8px; margin:14px 0; flex-wrap:wrap; }
.term-pill { padding:8px 16px; border-radius:999px; border:1.5px solid var(--dash-border); background:var(--dash-card); font-size:12px; font-weight:800; cursor:pointer; transition:var(--transition-fast); }
.term-pill:hover { border-color:var(--dash-green); }
.term-pill.active { background:linear-gradient(180deg,var(--dash-green),var(--dash-green-2)); color:#04150a; border-color:var(--dash-green-2); box-shadow:var(--shadow-sm); }

table.data-table { width:100%; border-collapse:collapse; font-size:12.5px; }
table.data-table th, table.data-table td { border:1px solid var(--dash-border); padding:8px 9px; text-align:center; }
table.data-table th { background:var(--dash-card-2); color:var(--dash-accent); font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; font-weight:800; position:sticky; top:0; }
table.data-table tbody tr:hover { background:var(--dash-green-soft); }
table.data-table input { width:52px; padding:5px; text-align:center; border-radius:var(--radius-xs); border:1.5px solid var(--dash-border); background:var(--dash-surface); color:var(--dash-text); transition:var(--transition-fast); }
table.data-table input:focus { outline:none; border-color:var(--dash-green); box-shadow:0 0 0 3px var(--dash-green-soft); }
table.data-table td.name-cell { text-align:left; font-weight:700; }
table.data-table th:first-child, table.data-table td.name-cell {
  position:sticky; left:0; background:var(--dash-card); z-index:2;
}
table.data-table th:first-child { background:var(--dash-card-2); z-index:3; }
table.data-table input:disabled { opacity:.4; cursor:not-allowed; background:repeating-linear-gradient(135deg,var(--dash-border),var(--dash-border) 3px,transparent 3px,transparent 7px); }

.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.62); backdrop-filter:blur(2px); z-index:500; display:none; align-items:center; justify-content:center; padding:16px; }
.modal-overlay.show { display:flex; animation:fadeInUp .18s ease; }
.modal-box { background:var(--dash-surface); border:1px solid var(--dash-border); border-radius:var(--radius-lg); padding:26px; max-width:440px; width:100%; max-height:88vh; overflow-y:auto; box-shadow:var(--shadow-lg); }
.modal-box h3 { font-family:var(--font-display); color:var(--dash-text); margin-top:0; font-size:17px; font-weight:800; }

.settings-card { background:var(--dash-card); border:1px solid var(--dash-border); border-radius:var(--radius); padding:20px 18px; margin-bottom:16px; box-shadow:var(--shadow-sm); }
.settings-card-title { font-size:12.5px; font-weight:900; color:var(--dash-accent); margin-bottom:16px; text-transform:uppercase; letter-spacing:.05em; }
.settings-row { display:flex; justify-content:space-between; align-items:center; padding:11px 0; border-bottom:1px solid var(--dash-border); gap:10px; flex-wrap:wrap; }
.settings-row:last-child { border-bottom:none; }

.pill-list { display:flex; flex-wrap:wrap; gap:8px; }
.tag { background:var(--dash-green-soft); color:var(--dash-accent); padding:5px 12px; border-radius:999px; font-size:11px; font-weight:800; display:flex; align-items:center; gap:6px; }
.tag button { background:none; border:none; color:inherit; cursor:pointer; opacity:.7; transition:var(--transition-fast); }
.tag button:hover { opacity:1; }

/* ---------- Toast notifications ---------- */
.toast { background:var(--dash-surface); border:1px solid var(--dash-border); border-left:4px solid var(--dash-green);
  border-radius:var(--radius-sm); padding:12px 16px; box-shadow:var(--shadow-lg); font-size:13px; font-weight:700;
  color:var(--dash-text); display:flex; align-items:center; gap:10px; animation:toastIn .25s cubic-bezier(.4,0,.2,1); }
.toast.toast-error { border-left-color:var(--dash-danger); }
.toast.toast-info { border-left-color:var(--dash-info); }
.toast i { font-size:15px; }
.toast.toast-success i { color:var(--dash-green); }
.toast.toast-error i { color:var(--dash-danger); }
.toast.toast-info i { color:var(--dash-info); }
@keyframes toastIn { from{opacity:0; transform:translateX(20px);} to{opacity:1; transform:translateX(0);} }
@keyframes toastOut { from{opacity:1; transform:translateX(0);} to{opacity:0; transform:translateX(20px);} }
.toast.toast-out { animation:toastOut .2s ease forwards; }


/* ---------- Report card (EXACT structure/CSS from original app) ---------- */
.card.category-nursery { --primary:#A52A2A !important; --soft:#FFDCDC !important; --accent:#800000 !important; --border:#A52A2A !important; }
.card.category-jss     { --primary:#6A0DAD !important; --soft:#E6D9F5 !important; --accent:#4B0082 !important; --border:#6A0DAD !important; }
.card.category-ss      { --primary:#000080 !important; --soft:#CCE5FF !important; --accent:#003366 !important; --border:#000080 !important; }

.card {
  background:#fff; border-radius:10px; padding:14px;
  border:2px solid var(--border); margin:0 auto 20px; max-width:820px;
  position:relative; color:#222;
  font-family:'Inter',system-ui,sans-serif;
}
.card * { font-family:'Inter',system-ui,sans-serif; }
.card .card-top { display:flex; align-items:center; gap:12px; margin-bottom:8px; }
.card .card-top .logo-container { flex:0 0 86px; text-align:center; }
.card .card-top .logo-container img { width:86px; height:86px; object-fit:contain; border-radius:10px; border:1px solid rgba(0,0,0,0.04); }
.school-logo-img { width:86px; height:86px; object-fit:contain; border-radius:10px; }
.school-title { flex:1; }
.card .school-title h2 { color:var(--primary); font-size:18px; font-weight:900; margin-bottom:4px; text-align:center; }
.card .school-title p  { color:var(--muted); font-size:11px; margin:0; text-align:center; }
.card .school-title .muted { font-size:10px; }
.card .contact-info { font-size:10px; color:var(--accent); text-align:center; margin-top:4px; font-weight:700; }

.info-separator { border:0; border-top:1px solid var(--border); margin:8px 0; }

.student-header {
  padding:6px 0; margin-top:6px; margin-bottom:6px;
  display:flex; justify-content:space-between; align-items:flex-end;
  border-bottom:2px solid var(--soft);
  font-size:14px; font-weight:800;
}
.student-header .name-block { font-size:18px; font-weight:900; color:var(--primary); }
.student-header .report-term { flex-grow:1; text-align:center; color:var(--accent); font-size:14px; font-weight:900; }
.student-header .session-info { color:var(--accent); white-space:nowrap; font-weight:900; }
.student-header .name-block strong { color:var(--accent); font-weight:800; margin-right:4px; }

.info-table { width:100%; border-collapse:collapse; margin-top:4px; font-size:12px; font-weight:900; }
.info-table td { text-align:left; color:#222; border:1px solid rgba(31,107,59,0.25); font-weight:800; flex-basis:33.33%; padding:4px 8px !important; vertical-align:middle; }
.info-table tr { display:flex; }
.info-table td strong { color:var(--accent); font-weight:900; margin-right:4px; display:inline-block; min-width:80px; }
.info-table .data { font-weight:900; color:#222; }

.card-subjects { margin-top:6px; }
.card-subjects table { width:100%; border-collapse:collapse; font-size:13px; }
.card-subjects th, .card-subjects td { border:1px solid var(--border); padding:3px 4px !important; font-size:11px; font-weight:800; color:#222; }
.card-subjects thead th { background:var(--primary); color:#fff; }
.card-subjects tbody td { background:var(--soft); }

.lower-row { display:flex; gap:12px; align-items:stretch; margin-top:12px; }
.grading-box { flex-basis:40%; border-radius:10px; padding:8px; background:transparent; border:1px solid rgba(0,0,0,0.04); }
.grading-box table { width:100%; border-collapse:collapse; font-size:13px; }
.grading-box th, .grading-box td { padding:6px; border:1px solid rgba(0,0,0,0.06); font-weight:800; color:#222; }
.grading-box thead th { background:var(--primary); color:#fff; }
.grading-box tbody td { background:var(--soft); }
.total-summary { flex-basis:60%; display:flex; flex-direction:column; align-items:stretch; }
.total-summary .summary-title { font-size:10px; font-weight:900; text-align:center; color:var(--accent); text-transform:uppercase; letter-spacing:0.06em; margin-bottom:3px; }
.total-summary table { width:100%; border-collapse:collapse; font-size:11px; }
.total-summary thead th { background:var(--primary); color:#fff; border:2px solid var(--border); font-weight:800; padding:4px; text-align:center; }
.total-summary tbody td { background:var(--soft); border:2px solid var(--border); vertical-align:middle; text-align:center; font-weight:800; padding:4px; color:#222; font-size:11px; }

.annual-summary-box { flex-basis:40%; border-radius:8px; padding:6px; border:1px solid var(--border); background:var(--soft); font-size:10px; }
.annual-summary-box table { width:100%; border-collapse:collapse; }
.annual-summary-box th { background:var(--primary); color:#fff; padding:4px 3px; font-size:9px; font-weight:800; border:1px solid var(--border); text-align:center; }
.annual-summary-box td { background:#fff; padding:4px 3px; font-size:9px; font-weight:800; border:1px solid var(--border); text-align:center; color:#222; }
.annual-summary-box .ann-title { font-size:9px; font-weight:900; color:var(--accent); text-align:center; text-transform:uppercase; margin-bottom:3px; letter-spacing:0.04em; }

@media print {

  .sig-line { border-top:1.5px solid #000 !important; }

<!-- ============ LOGIN ============ -->
<div id="loginScreen" class="login-split">
  <div class="login-hero">
    <div>
      <div class="login-hero-title">Pariya School<br/>Management System</div>
      <div class="login-hero-sub">Nursery • Primary • JSS • SS — fully powered by Supabase.</div>
    </div>
    <div class="login-hero-sub">© <span id="heroYear"></span> Pariya Academy</div>
  </div>
  <div class="login-right">
    <div class="login-box">
      <div class="login-school">
        <img id="loginSchoolLogo" src="" alt="" style="display:none;width:64px;height:64px;object-fit:contain;border-radius:12px;margin:0 auto 10px;" onerror="this.style.display='none'"/>
        <h1 id="loginSchoolName">Pariya School Management System</h1>
        <p>Sign in to continue</p>
      </div>
      <div class="login-tabs">
        <div class="login-tab active" data-mode="staff" onclick="setLoginMode('staff')">Staff / Admin</div>
        <div class="login-tab" data-mode="student" onclick="setLoginMode('student')">Student</div>
      </div>
      <div id="loginError" class="login-error"></div>

      <form id="staffLoginForm" onsubmit="return handleStaffLogin(event)">
        <div class="field"><label>Staff ID</label><input id="staffCode" required autocomplete="username"/></div>
        <div class="field"><label>Password</label><input id="staffPassword" type="password" required autocomplete="current-password"/></div>
        <label style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dash-muted);margin-bottom:14px;">
          <input type="checkbox" id="staffRemember" checked style="width:auto;"/> Remember me on this device
        </label>
        <button class="btn-primary" type="submit" id="staffLoginBtn">Sign In</button>
      </form>

      <form id="studentLoginForm" style="display:none;" onsubmit="return handleStudentLogin(event)">
        <div class="field"><label>Admission Number</label><input id="stuAdm" required/></div>
        <div class="field"><label>Class</label><select id="stuClass" required></select></div>
        <div class="field"><label>Password</label><input id="stuPassword" type="password" required/></div>
        <button class="btn-primary" type="submit" id="studentLoginBtn">Sign In</button>
      </form>
    </div>
  </div>
</div>

<!-- ============ APP SHELL ============ -->
<div id="appShell" class="app-shell">
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar(false)"></div>
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-header-title" id="sidebarSchoolName">Pariya SMS</div>
      <button class="sidebar-close" onclick="toggleSidebar(false)"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="sidebar-nav" id="sidebarNav"></div>
    <div class="sidebar-footer">
      <button class="btn" style="width:100%;" onclick="signOut()"><i class="fa-solid fa-right-from-bracket"></i> Sign Out</button>
    </div>
  </div>

  <div class="main-area">
    <div class="topbar">
      <button class="hamburger-btn" onclick="toggleSidebar(true)"><i class="fa-solid fa-bars"></i></button>
      <div style="flex:1;">
        <div id="topbarGreeting" style="font-size:11px;color:var(--dash-accent);font-weight:800;"></div>
        <div class="topbar-title" id="topbarTitle">Dashboard</div>
      </div>
      <span class="topbar-role" id="topbarRole"></span>
      <button class="theme-toggle-btn" onclick="toggleTheme()"><i class="fa-solid fa-circle-half-stroke"></i></button>
    </div>

    <div id="tabRoot"></div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box" id="modalBox"></div>
</div>

<div id="toastHost" class="no-print" style="position:fixed;bottom:20px;right:20px;z-index:900;display:flex;flex-direction:column;gap:10px;max-width:320px;"></div>
